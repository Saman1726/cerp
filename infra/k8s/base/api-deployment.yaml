apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: cerp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cerp-api
  template:
    metadata:
      labels:
        app: cerp-api
    spec:
      containers:
        - name: api
          image: cerp-api:local
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
