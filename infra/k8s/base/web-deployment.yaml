apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: cerp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cerp-web
  template:
    metadata:
      labels:
        app: cerp-web
    spec:
      containers:
        - name: web
          image: cerp-web:local
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
