# Two distinct hosts, not a wildcard: v1 resolves tenants via header/JWT claim.
# A wildcard host for per-tenant subdomains is a natural v2 upgrade once resolution changes.
# Nothing else in this ingress would need to change for that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cerp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.cerp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-java
                port:
                  number: 8080
    - host: app.cerp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
