apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cerp
  labels:
    app: api-gateway
    service: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      service: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        service: api-gateway
        tier: gateway
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/actuator/prometheus'
    spec:
      containers:
        - name: api-gateway
          image: cerp/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: cerp-config
                  key: keycloak-issuer-uri
                  optional: true
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: cerp-config
                  key: keycloak-client-id
                  optional: true
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cerp-secrets
                  key: keycloak-gateway-client-secret
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cerp-config
                  key: cors-allowed-origins
                  optional: true
            - name: CERP_IDENTITY_SERVICE_URL
              value: http://identity-service-java:8080
            - name: CERP_ORGANIZATION_SERVICE_URL
              value: http://catalog-service-java:8080
            - name: CERP_DMS_SERVICE_URL
              value: http://vendor-service-java:8080
            - name: CERP_VENDOR_SERVICE_URL
              value: http://vendor-service-java:8080
            - name: CERP_CATALOG_SERVICE_URL
              value: http://catalog-service-java:8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cerp
  labels:
    app: api-gateway
    service: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api-gateway
    service: api-gateway
