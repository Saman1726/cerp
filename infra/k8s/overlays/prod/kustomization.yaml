apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerp-prod
resources:
  - ../../base
# No postgres component here: production points at a managed Postgres
# instance via api-secrets' DATABASE_URL (created out-of-band), not the
# in-cluster StatefulSet used for dev/staging convenience.
images:
  - name: cerp-web:local
    newName: ghcr.io/saman1726/cerp-web
    newTag: prod
