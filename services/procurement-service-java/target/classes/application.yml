server:
  port: 8087

spring:
  application:
    name: procurement-service-java

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cerp}
    username: ${DB_USER:cerp}
    password: ${DB_PASSWORD:cerp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      # Optional: idempotent producer and retries for reliability
      enable.idempotence: true
      acks: all
      retries: 5
      max.in.flight.requests.per.connection: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8080/realms/cerp}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

app:
  topics:
    request: procurement.request.v1
    po: procurement.po.v1
  security:
    # Name of header to optionally cross-validate tenant id from requests
    tenant-header: X-Tenant-Id
