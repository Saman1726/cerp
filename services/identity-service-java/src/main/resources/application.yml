spring:
  application:
    name: identity-service-java

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cerp}
    username: ${DB_USERNAME:cerp}
    password: ${DB_PASSWORD:cerp}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: identity
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    baseline-on-migrate: true
    default-schema: identity
    schemas: identity

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/master}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

app:
  events:
    enabled: ${APP_EVENTS_ENABLED:false}
