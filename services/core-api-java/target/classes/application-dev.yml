spring:
  application:
    name: core-api-java
  autoconfigure:
    # Disable DB/JPA/Flyway autoconfiguration for local dev profile so the app can run without Postgres
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO

# Usage:
# Run locally without a database:
#   mvn -DskipTests spring-boot:run -Dspring-boot.run.profiles=dev
