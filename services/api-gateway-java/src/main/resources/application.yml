server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Default global filters
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            key-resolver: '#{@ipKeyResolver}'
      # Add correlation ID to responses
      global-cors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - 'https://localhost:3001'
              - 'https://localhost:3000'
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Tenant-Id
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: true
            maxAge: 3600

  # OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${cerp.gateway.issuer-uri:http://localhost:8081/realms/cerp}
          jwk-set-uri: ${cerp.gateway.issuer-uri:http://localhost:8081/realms/cerp}/protocol/openid-connect/certs

# CERP Gateway configuration
cerp:
  gateway:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/cerp}
    client-id: ${KEYCLOAK_CLIENT_ID:cerp-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    logout:
      path: /logout
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3001,https://localhost:3000}
    request-id-header: X-Request-Id
    tenant:
      jwt-claim: resource_access

# Backend service URLs
cerp:
  services:
    identity:
      url: ${CERP_IDENTITY_SERVICE_URL:http://localhost:8083}
    organization:
      url: ${CERP_ORGANIZATION_SERVICE_URL:http://localhost:8084}
    project:
      url: ${CERP_PROJECT_SERVICE_URL:http://localhost:8085}
    dms:
      url: ${CERP_DMS_SERVICE_URL:http://localhost:8086}
    projections:
      url: ${CERP_PROJECTIONS_SERVICE_URL:http://localhost:8087}
    audit:
      url: ${CERP_AUDIT_SERVICE_URL:http://localhost:8088}
    procurement:
      url: ${CERP_PROCUREMENT_SERVICE_URL:http://localhost:9091}
    vendor:
      url: ${CERP_VENDOR_SERVICE_URL:http://localhost:9092}
    catalog:
      url: ${CERP_CATALOG_SERVICE_URL:http://localhost:9093}
    workflow:
      url: ${CERP_WORKFLOW_SERVICE_URL:http://localhost:8089}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

# Logging
logging:
  level:
    root: INFO
    io.cerp.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id:-no-correlation-id}] [%X{X-Tenant-Id:-no-tenant-id}] %-5level %logger{36} - %msg%n'
