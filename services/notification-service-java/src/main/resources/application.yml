spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cerp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification
        show_sql: false
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.cerp.notification.*
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: notificationCreated:io.cerp.notification.event.NotificationJobCreated,notificationPublished:io.cerp.notification.event.NotificationJobPublished,notificationOpened:io.cerp.notification.event.NotificationOpened,notificationActionTaken:io.cerp.notification.event.NotificationActionTaken

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: always

logging:
  level:
    io.cerp.notification: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,kafka
  endpoint:
    health:
      show-details: always

# Notification service specific config
notification:
  kafka:
    inbound:
      topic: ${NOTIFICATION_INBOUND_TOPIC:notification-job-create-request}
      group-id: ${NOTIFICATION_INBOUND_GROUP_ID:notification-service}
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://identity-service-java:8090}
  worker:
    enabled: true
    schedule: "*/5 * * * *"
    thread-pool-size: 5
  webhook:
    enabled: true
    timeout-ms: 5000
  email:
    enabled: false
