server:
  port: ${PORT:8092}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: document-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cerp}
    username: ${DB_USER:cerp}
    password: ${DB_PASSWORD:cerp_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: document

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: document
    schemas: document
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/realms/cerp}

# Object storage (MinIO locally, any S3-compatible provider in a real deployment).
cerp:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Endpoint baked into presigned URLs returned to the browser. Separate from
    # `endpoint` above because the service itself talks to storage over the
    # Docker-internal network, but the browser doing the actual upload (on this
    # laptop or a phone on the same Wi-Fi) needs a LAN-reachable address instead.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}
    bucket: ${MINIO_BUCKET:site-captures}
    presign-ttl-minutes: ${MINIO_PRESIGN_TTL_MINUTES:1440}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    io.cerp.document: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id:-no-correlation-id}] %-5level %logger{36} - %msg%n'
