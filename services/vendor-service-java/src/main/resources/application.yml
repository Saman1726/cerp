server:
  port: 8085

spring:
  application:
    name: vendor-service-java

  datasource:
    url: ${DB_URL:jdbc:postgresql://supply-postgres:5432/supply_db}
    username: ${DB_USER:-cerp}
    password: ${DB_PASSWORD:-cerp_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: vendor
    validate-on-migrate: false
    # Use default schema "public" unless overridden
    baseline-on-migrate: true
    out-of-order: true
    # Unique history table per service to avoid conflicts when sharing supply_db
    table: flyway_schema_history_vendor

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      # Optional: idempotent producer and retries for reliability
      enable.idempotence: true
      acks: all
      retries: 5
      max.in.flight.requests.per.connection: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8080/realms/cerp}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

app:
  topics:
    vendor: supply.vendor.v1
    vendor-registration: vendor.registered.v1
    vendor-identity: identity.vendor.v1
  security:
    # Name of header to optionally cross-validate tenant id from requests
    tenant-header: X-Tenant-Id
  kafka:
    consumer:
      group-id: vendor-service
  events:
    enabled: ${EVENTS_ENABLED:false}
