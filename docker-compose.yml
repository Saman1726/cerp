services:
  postgres:
    image: postgres:17-alpine
    container_name: cerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cerp}
    ports:
      - '5432:5432'
    volumes:
      - cerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d ${POSTGRES_DB:-cerp}']
      interval: 5s
      timeout: 5s
      retries: 10

  partner-system-java:
    build:
      context: services/partner-system-java
      dockerfile: Dockerfile
    container_name: cerp-partner-system-java
    environment:
      PORT: 3020
    # No host port published to avoid conflict with Node partner-system (3020).
    # Reached by other containers via http://partner-system-java:3020

  api-java:
    build:
      context: services/core-api-java
      dockerfile: Dockerfile
    container_name: cerp-api-java
    depends_on:
      postgres:
        condition: service_healthy
      partner-system-java:
        condition: service_started
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      PARTNER_SYSTEM_URL: http://partner-system-java:3020
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - '8080:8080'

  identity-service-java:
    build:
      context: services/identity-service-java
      dockerfile: Dockerfile
    container_name: cerp-identity-service-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8090
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OIDC_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_EVENTS_ENABLED: "true"
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - '8090:8090'

  catalog-service-java:
    build:
      context: services/catalog-service-java
      dockerfile: Dockerfile
    container_name: cerp-catalog-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8086:8086'

  vendor-service-java:
    build:
      context: services/vendor-service-java
      dockerfile: Dockerfile
    container_name: cerp-vendor-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8085:8085'

  project-service-java:
    build:
      context: services/project-service-java
      dockerfile: Dockerfile
    container_name: cerp-project-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8088:8088'

  workflow-service-java:
    build:
      context: services/workflow-service-java
      dockerfile: Dockerfile
    container_name: cerp-workflow-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8089:8089'

  procurement-service-java:
    build:
      context: services/procurement-service-java
      dockerfile: Dockerfile
    container_name: cerp-procurement-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8087:8087'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: cerp-web
    working_dir: /app
    depends_on:
      - api-java
    environment:
      NODE_ENV: development
      API_URL: http://api-java:8080
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    command: pnpm --filter web run dev
    profiles:
      - legacy


  # Local platform baseline (enable with: docker compose --profile platform up -d)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: cerp-keycloak
    command: start-dev --http-port 8081
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/realms/master']
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cerp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'bash', '-lc', "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cerp-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD', 'bash', '-lc', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: cerp-schema-registry
    depends_on:
      kafka:
        condition: service_started
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8082
    ports:
      - '8082:8082'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8082/subjects']
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: cerp-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - cerp_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  cerp_postgres_data:
  cerp_minio_data: