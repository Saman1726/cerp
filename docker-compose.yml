services:
  postgres:
    image: postgres:17-alpine
    container_name: cerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cerp}
    ports:
      - '5432:5432'
    volumes:
      - cerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d ${POSTGRES_DB:-cerp}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    container_name: cerp-api
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerp}:${POSTGRES_PASSWORD:-cerp_dev_password}@postgres:5432/${POSTGRES_DB:-cerp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_only_change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_only_change_me_refresh}
      JWT_ACCESS_TTL: 15m
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    command: pnpm --filter api run dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: cerp-web
    working_dir: /app
    depends_on:
      - api
    environment:
      NODE_ENV: development
      API_URL: http://api:3000
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    command: pnpm --filter web run dev

volumes:
  cerp_postgres_data:
