services:
  postgres:
    image: postgres:17-alpine
    container_name: cerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cerp}
    ports:
      - '5432:5432'
    volumes:
      - cerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d ${POSTGRES_DB:-cerp}']
      interval: 5s
      timeout: 5s
      retries: 10

  api-java:
    build:
      context: services/core-api-java
      dockerfile: Dockerfile
    container_name: cerp-api-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      SPRING_FLYWAY_ENABLED: "false"
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
    ports:
      - '8080:8080'

  identity-service-java:
    build:
      context: services/identity-service-java
      dockerfile: Dockerfile
    container_name: cerp-identity-service-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8090
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OIDC_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_EVENTS_ENABLED: "true"
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - '8090:8090'

  catalog-service-java:
    build:
      context: services/catalog-service-java
      dockerfile: Dockerfile
    container_name: cerp-catalog-service-java
    depends_on:
      supply-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8086
      DB_URL: jdbc:postgresql://supply-postgres:5432/supply_db
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - '8086:8086'

  supply-postgres:
    image: postgres:17-alpine
    container_name: cerp-supply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: supply_db
    ports:
      - '5433:5432'
    volumes:
      - cerp_supply_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d supply_db']
      interval: 5s
      timeout: 5s
      retries: 10

  vendor-service-java:
    build:
      context: services/vendor-service-java
      dockerfile: Dockerfile
    container_name: cerp-vendor-service-java
    depends_on:
      supply-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://supply-postgres:5432/supply_db
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DEV_MODE: "true"
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
    ports:
      - '8085:8085'

  project-service-java:
    build:
      context: services/project-service-java
      dockerfile: Dockerfile
    container_name: cerp-project-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8095:8085'

  workflow-service-java:
    build:
      context: services/workflow-service-java
      dockerfile: Dockerfile
    container_name: cerp-workflow-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - '8089:8089'
      - '5005:5005'

  procurement-service-java:
    build:
      context: services/procurement-service-java
      dockerfile: Dockerfile
    container_name: cerp-procurement-service-java
    depends_on:
      supply-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8087
      DB_URL: jdbc:postgresql://supply-postgres:5432/supply_db
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - '8087:8087'

  web:
    image: node:24-alpine
    container_name: cerp-web
    working_dir: /app
    depends_on:
      - api-java
      - project-service-java
      - workflow-service-java
      - identity-service-java
      - vendor-service-java
    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Server-side URL for API proxy routes (uses Docker DNS to reach services)
      VENDOR_SERVICE_URL: http://vendor-service-java:8085
      # These URLs are embedded in the browser bundle, so use host.docker.internal
      # to reach services via the host's forwarded ports (not Docker service names)
      NEXT_PUBLIC_API_URL: http://host.docker.internal:8080
      NEXT_PUBLIC_PROJECT_SERVICE_URL: http://host.docker.internal:8095
      NEXT_PUBLIC_WORKFLOW_SERVICE_URL: http://host.docker.internal:8089
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://host.docker.internal:8090
      NEXT_PUBLIC_VENDOR_SERVICE_URL: http://host.docker.internal:8085
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core-web/node_modules
      - /app/packages/shared-types/node_modules
    # Exclude .env.local so Docker's NEXT_PUBLIC_* env vars take precedence
    command: sh -c "rm -f apps/web/.env.local && corepack enable && pnpm install --frozen-lockfile && pnpm --filter web run dev"
    profiles:
      - legacy


  # Local platform baseline (enable with: docker compose --profile platform up -d)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: cerp-keycloak
    command: start-dev --http-port 8081
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/realms/master']
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cerp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'bash', '-lc', "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cerp-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD', 'bash', '-lc', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  cerp_postgres_data:
  cerp_supply_data:
