services:
  postgres:
    image: postgres:17-alpine
    container_name: cerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cerp}
    ports:
      - '5432:5432'
    volumes:
      - cerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d ${POSTGRES_DB:-cerp}']
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service-java:
    build:
      context: services/identity-service-java
      dockerfile: Dockerfile
    container_name: cerp-identity-service-java
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PORT: 8090
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OIDC_ISSUER_URI: http://keycloak:8081/realms/cerp
      KEYCLOAK_URL: http://keycloak:8081
      KEYCLOAK_REALM: cerp
      KEYCLOAK_CLIENT_ID: cerp-identity-service
      KEYCLOAK_CLIENT_SECRET: cerp-identity-service-dev-secret
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_EVENTS_ENABLED: "true"
      SPRING_FLYWAY_ENABLED: "true"
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5007"
    ports:
      - '8090:8090'
      - '5007:5007'

  catalog-service-java:
    build:
      context: services/catalog-service-java
      dockerfile: Dockerfile
    container_name: cerp-catalog-service-java
    depends_on:
      supply-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8086
      DB_URL: jdbc:postgresql://supply-postgres:5432/supply_db
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - '8086:8086'

  supply-postgres:
    image: postgres:17-alpine
    container_name: cerp-supply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: supply_db
    ports:
      - '5433:5432'
    volumes:
      - cerp_supply_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d supply_db']
      interval: 5s
      timeout: 5s
      retries: 10

  vendor-service-java:
    build:
      context: services/vendor-service-java
      dockerfile: Dockerfile
    container_name: cerp-vendor-service-java
    depends_on:
      supply-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://supply-postgres:5432/supply_db
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      DEV_MODE: "true"
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
    ports:
      - '8085:8085'

  project-service-java:
    build:
      context: services/project-service-java
      dockerfile: Dockerfile
    container_name: cerp-project-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity-service-java:
        condition: service_started
      workflow-service-java:
        condition: service_started
    environment:
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/cerp
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
      WORKFLOW_SERVICE_URL: http://workflow-service-java:8089
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8095:8085'

  workflow-service-java:
    build:
      context: services/workflow-service-java
      dockerfile: Dockerfile
    container_name: cerp-workflow-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity-service-java:
        condition: service_started
    environment:
      SERVER_PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/master
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
      VENDOR_SERVICE_URL: http://vendor-service-java:8085
      NOTIFICATION_SERVICE_URL: http://notification-service-java:8091
    ports:
      - '8089:8089'
      - '5005:5005'

  # Notification service - manages notification jobs and individual notifications
  # Usage: docker compose --profile notification up -d
  notification-service-java:
    build:
      context: services/notification-service-java
      dockerfile: Dockerfile
    container_name: cerp-notification-service-java
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8091
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
    ports:
      - '8091:8091'

  # S3-compatible object storage for document-service-java's presigned
  # uploads. Console UI at :9001 (login with the credentials below) is handy
  # for confirming a capture actually landed in the bucket.
  minio:
    image: minio/minio:latest
    container_name: cerp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - cerp_minio_data:/data

  document-service-java:
    build:
      context: services/document-service-java
      dockerfile: Dockerfile
    container_name: cerp-document-service-java
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 8092
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USER: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      OAUTH_ISSUER_URI: http://keycloak:8081/realms/cerp
      SPRING_FLYWAY_ENABLED: "true"
      # Internal endpoint this service itself uses to reach MinIO (bucket/CORS
      # bootstrap on startup).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: site-captures
      # Endpoint baked into presigned URLs handed to the browser - must be
      # reachable from wherever the browser actually is (this laptop or a
      # phone on the same Wi-Fi), not Docker's internal network. Update this
      # if the laptop's LAN IP changes.
      MINIO_PUBLIC_ENDPOINT: http://192.168.8.213:9000
    ports:
      - '8092:8092'

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      target: dev
    container_name: cerp-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - project-service-java
      - workflow-service-java
      - identity-service-java
      - vendor-service-java
      - notification-service-java
      - document-service-java
    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Server-only: this container's own Next process reaches its sibling
      # containers via Docker DNS, on each service's real (internal) port -
      # cheaper and more reliable than bouncing out to the LAN and back in.
      # core-web/lib/env.ts prefers these over the NEXT_PUBLIC_* versions
      # below, and only server-side - Next strips non-NEXT_PUBLIC_ vars from
      # the browser bundle, so the browser never sees these at all.
      API_URL: http://api-java:8080
      PROJECT_SERVICE_URL: http://project-service-java:8085
      WORKFLOW_SERVICE_URL: http://workflow-service-java:8089
      IDENTITY_SERVICE_URL: http://identity-service-java:8090
      VENDOR_SERVICE_URL: http://vendor-service-java:8085
      NOTIFICATION_SERVICE_URL: http://notification-service-java:8091
      DOCUMENT_SERVICE_URL: http://document-service-java:8092
      # These get embedded in the browser bundle, so they must be reachable
      # from whatever device is actually running the browser (this laptop or
      # a phone on the same Wi-Fi) - Docker-internal hostnames mean nothing
      # there. Update the host if this laptop's LAN IP changes.
      # NOTE: project-service-java's host-published port is 8095, not its
      # internal 8085 (8085 on the host belongs to vendor-service-java).
      NEXT_PUBLIC_API_URL: http://192.168.8.213:8080
      NEXT_PUBLIC_PROJECT_SERVICE_URL: http://192.168.8.213:8095
      NEXT_PUBLIC_WORKFLOW_SERVICE_URL: http://192.168.8.213:8089
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://192.168.8.213:8090
      NEXT_PUBLIC_VENDOR_SERVICE_URL: http://192.168.8.213:8085
      NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: http://192.168.8.213:8091
    ports:
      - '3001:3001'
    profiles:
      - legacy

  # Local platform baseline (enable with: docker compose --profile platform up -d)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: cerp-keycloak
    command: start-dev --http-port 8081
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/realms/master']
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cerp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'bash', '-lc', "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cerp-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD', 'bash', '-lc', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  cerp_postgres_data:
  cerp_supply_data:
  cerp_minio_data: