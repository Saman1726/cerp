services:
  postgres:
    image: postgres:16-alpine
    container_name: cerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cerp}
    ports:
      - '5432:5432'
    volumes:
      - cerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerp} -d ${POSTGRES_DB:-cerp}']
      interval: 5s
      timeout: 5s
      retries: 10

  partner-system-db:
    image: postgres:17-alpine
    container_name: cerp-partner-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PARTNER_SYSTEM_DB_USER:-partner_system}
      POSTGRES_PASSWORD: ${PARTNER_SYSTEM_DB_PASSWORD:-partner_system_dev_password}
      POSTGRES_DB: ${PARTNER_SYSTEM_DB_NAME:-partner_system}
    ports:
      - '5433:5432'
    volumes:
      - cerp_partner_system_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PARTNER_SYSTEM_DB_USER:-partner_system} -d ${PARTNER_SYSTEM_DB_NAME:-partner_system}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  partner-system:
    build:
      context: .
      dockerfile: services/partner-system/Dockerfile
      target: deps
    container_name: cerp-partner-system
    working_dir: /app
    depends_on:
      partner-system-db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3020
      DATABASE_URL: postgresql://${PARTNER_SYSTEM_DB_USER:-partner_system}:${PARTNER_SYSTEM_DB_PASSWORD:-partner_system_dev_password}@partner-system-db:5432/${PARTNER_SYSTEM_DB_NAME:-partner_system}
    ports:
      - '3020:3020'
    volumes:
      - ./services/partner-system:/app/services/partner-system
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/partner-system/node_modules
    command: pnpm --filter partner-system run dev

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    container_name: cerp-api
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      partner-system:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerp}:${POSTGRES_PASSWORD:-cerp_dev_password}@postgres:5432/${POSTGRES_DB:-cerp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_only_change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_only_change_me_refresh}
      JWT_ACCESS_TTL: 15m
      PARTNER_SYSTEM_URL: http://partner-system:3020
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    command: pnpm --filter api run dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: cerp-web
    working_dir: /app
    depends_on:
      - api
    environment:
      NODE_ENV: development
      API_URL: http://api:3000
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    command: pnpm --filter web run dev

  demo-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: cerp-demo-web
    working_dir: /app
    depends_on:
      - api
    environment:
      NODE_ENV: development
      API_URL: http://api:3000
    ports:
      - '3011:3011'
    volumes:
      - ./examples/demo-overlay/web:/app/examples/demo-overlay/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/examples/demo-overlay/web/node_modules
    command: pnpm --filter demo-overlay-web run dev

  api-java:
    image: cerp/core-api-java:local
    container_name: cerp-api-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cerp}
      DB_USERNAME: ${POSTGRES_USER:-cerp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cerp_dev_password}
    ports:
      - '8080:8080'

volumes:
  cerp_postgres_data:
  cerp_partner_system_db_data:
