name: Changesets Versioning

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Create/Update Release PR (Changesets)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run Changesets in "version only" mode:
      # - If there are pending changesets, this creates/updates a Release PR with bumped versions and changelogs.
      # - When merged, this will not attempt to publish (no registry configured yet).
      - name: Changesets - Create/Update Release PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # Note: no "publish" command provided intentionally to avoid publishing until registry is configured.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
