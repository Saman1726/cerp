name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: ghcr.io/saman1726/cerp-web
          - name: api-java
            context: services/core-api-java
            file: services/core-api-java/Dockerfile
            image: ghcr.io/saman1726/cerp-api-java
          - name: identity-service-java
            context: services/identity-service-java
            file: services/identity-service-java/Dockerfile
            image: ghcr.io/saman1726/cerp-identity-service-java
          - name: catalog-service-java
            context: services/catalog-service-java
            file: services/catalog-service-java/Dockerfile
            image: ghcr.io/saman1726/cerp-catalog-service-java
          - name: vendor-service-java
            context: services/vendor-service-java
            file: services/vendor-service-java/Dockerfile
            image: ghcr.io/saman1726/cerp-vendor-service-java
          - name: project-service-java
            context: services/project-service-java
            file: services/project-service-java/Dockerfile
            image: ghcr.io/saman1726/cerp-project-service-java
          - name: workflow-service-java
            context: services/workflow-service-java
            file: services/workflow-service-java/Dockerfile
            image: ghcr.io/saman1726/cerp-workflow-service-java
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase, unlike the GitHub repo path itself.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
